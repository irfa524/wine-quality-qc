name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-train-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - run: pip install -r requirements-train.txt

      - name: Fetch DVC data
        run: dvc pull data/raw.dvc

      - name: Unit tests
        run: pytest -q

      - name: Check committed model is up to date
        run: |
          out=$(dvc status)
          echo "$out"
          echo "$out" | grep -q "Data and pipelines are up to date" || (echo "::error::Pipeline is stale. Run dvc repro locally and commit models, reports and dvc.lock" && exit 1)

      - name: Re-train and log MLflow run for this commit
        run: python -m src.train

      - uses: actions/upload-artifact@v4
        with:
          name: model-and-mlflow-${{ github.sha }}
          path: |
            models/
            reports/
            mlflow.db
