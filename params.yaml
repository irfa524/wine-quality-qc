seed: 42
test_size: 0.2
drop_duplicates: true
band_thresholds:        # predicted score < low  -> "Low"; >= high -> "Premium"; else "Standard"
  low: 5.5
  high: 6.5
model:
  max_iter: 300
  learning_rate: 0.05
  max_depth: 6
  min_samples_leaf: 20
  l2_regularization: 1.0
permutation_importance:
  n_repeats: 20
